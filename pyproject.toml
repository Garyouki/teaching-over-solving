[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tos-diagnostic"
version = "0.1.0"
description = "Teaching-over-solving diagnostic: separate how well an LLM tutor solves from how well it teaches."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Junyi Yao" },
  { name = "Zihao Zheng" },
  { name = "Baichuan Li" },
]
keywords = ["llm-tutors", "education", "evaluation", "pedagogy", "benchmark"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Education",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
tos-diagnostic = "tos_diagnostic.cli:main"

[project.urls]
Repository = "https://github.com/Garyouki/teaching-over-solving"
Paper = "https://openreview.net/forum?id=aZ1KTkxECP"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tos_diagnostic = ["data/*.csv", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
